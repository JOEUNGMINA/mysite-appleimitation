<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 — Apple Clone</title>
<meta name="description" content="구글 계정으로 로그인합니다.">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="gnav">
  <nav class="gnav-inner" aria-label="글로벌">
    <a class="gnav-logo" href="index.html" aria-label="홈">
      <svg viewBox="0 0 20 24" width="16" height="20" aria-hidden="true">
        <path fill="currentColor" d="M16.3 12.7c0-2.9 2.4-4.3 2.5-4.4-1.4-2-3.5-2.3-4.2-2.3-1.8-.2-3.5 1-4.4 1-.9 0-2.3-1-3.8-1-2 0-3.8 1.1-4.8 2.9-2 3.5-.5 8.8 1.5 11.6 1 1.4 2.1 3 3.6 2.9 1.4-.1 2-.9 3.7-.9 1.7 0 2.2.9 3.7.9 1.5 0 2.5-1.4 3.4-2.8 1.1-1.6 1.5-3.2 1.6-3.3-.1 0-3-1.2-3-4.6zM13.4 4.1c.8-1 1.3-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.7.9-1.4 2.3-1.2 3.6 1.3.1 2.6-.7 3.4-1.7z"/>
      </svg>
    </a>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">로그인</h1>
    <p class="auth-sub">구글 계정으로 계속하세요.<br>처음이시라면 자동으로 가입이 진행됩니다.</p>

    <p class="notice notice-error" id="errorBox" role="alert" hidden></p>

    <button type="button" class="btn btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span id="googleBtnLabel">구글로 계속하기</span>
    </button>

    <p class="auth-foot">
      계속 진행하면 서비스 이용약관과 개인정보 처리방침에 동의하게 됩니다.
    </p>
  </div>

  <p class="auth-foot"><a href="index.html">홈으로 돌아가기</a></p>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
