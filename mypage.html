<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이페이지 — Apple Clone</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="gnav">
  <nav class="gnav-inner" aria-label="글로벌">
    <a class="gnav-logo" href="index.html" aria-label="홈">
      <svg viewBox="0 0 20 24" width="16" height="20" aria-hidden="true">
        <path fill="currentColor" d="M16.3 12.7c0-2.9 2.4-4.3 2.5-4.4-1.4-2-3.5-2.3-4.2-2.3-1.8-.2-3.5 1-4.4 1-.9 0-2.3-1-3.8-1-2 0-3.8 1.1-4.8 2.9-2 3.5-.5 8.8 1.5 11.6 1 1.4 2.1 3 3.6 2.9 1.4-.1 2-.9 3.7-.9 1.7 0 2.2.9 3.7.9 1.5 0 2.5-1.4 3.4-2.8 1.1-1.6 1.5-3.2 1.6-3.3-.1 0-3-1.2-3-4.6zM13.4 4.1c.8-1 1.3-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.7.9-1.4 2.3-1.2 3.6 1.3.1 2.6-.7 3.4-1.7z"/>
      </svg>
    </a>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card" id="card" hidden>
    <div class="profile-head">
      <img class="avatar" id="avatar" alt="" hidden>
      <div class="avatar avatar-fallback" id="avatarFallback" aria-hidden="true"></div>
      <div class="profile-head-text">
        <p class="profile-name" id="headName"></p>
        <p class="profile-email" id="headEmail"></p>
      </div>
    </div>

    <p class="notice notice-error" id="errorBox" role="alert" hidden></p>
    <p class="notice notice-success" id="successBox" role="status" hidden></p>

    <form id="profileForm" novalidate>
      <label class="field">
        <span class="field-label">이름</span>
        <input class="field-input" type="text" id="displayName" maxlength="40" autocomplete="nickname" required>
      </label>

      <label class="field">
        <span class="field-label">이메일</span>
        <input class="field-input" type="email" id="email" disabled>
        <span class="field-help">구글 계정에서 가져온 값이라 변경할 수 없습니다.</span>
      </label>

      <button class="btn btn-primary" type="submit" id="saveBtn">저장</button>
    </form>

    <dl class="meta-list">
      <div><dt>권한</dt><dd id="roleCell"></dd></div>
      <div><dt>가입일</dt><dd id="createdCell"></dd></div>
      <div><dt>약관 동의</dt><dd id="termsCell"></dd></div>
    </dl>

    <div class="actions-row">
      <a class="btn btn-secondary" id="adminLink" href="admin.html" hidden>관리자페이지</a>
      <button type="button" class="btn btn-secondary" id="signOutBtn">로그아웃</button>
    </div>
  </div>

  <p class="loading" id="loading">불러오는 중…</p>
</main>

<script type="module" src="js/mypage.js"></script>
</body>
</html>
