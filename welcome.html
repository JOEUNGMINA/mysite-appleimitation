<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회원가입 — Apple Clone</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="gnav">
  <nav class="gnav-inner" aria-label="글로벌">
    <a class="gnav-logo" href="index.html" aria-label="홈">
      <svg viewBox="0 0 20 24" width="16" height="20" aria-hidden="true">
        <path fill="currentColor" d="M16.3 12.7c0-2.9 2.4-4.3 2.5-4.4-1.4-2-3.5-2.3-4.2-2.3-1.8-.2-3.5 1-4.4 1-.9 0-2.3-1-3.8-1-2 0-3.8 1.1-4.8 2.9-2 3.5-.5 8.8 1.5 11.6 1 1.4 2.1 3 3.6 2.9 1.4-.1 2-.9 3.7-.9 1.7 0 2.2.9 3.7.9 1.5 0 2.5-1.4 3.4-2.8 1.1-1.6 1.5-3.2 1.6-3.3-.1 0-3-1.2-3-4.6zM13.4 4.1c.8-1 1.3-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.7.9-1.4 2.3-1.2 3.6 1.3.1 2.6-.7 3.4-1.7z"/>
      </svg>
    </a>
  </nav>
</header>

<main class="auth-main">
  <div class="auth-card" id="card" hidden>
    <h1 class="auth-title">거의 다 됐습니다</h1>
    <p class="auth-sub">가입을 마치려면 아래 내용을 확인해 주세요.</p>

    <div class="profile-head">
      <img class="avatar" id="avatar" alt="" hidden>
      <div class="avatar avatar-fallback" id="avatarFallback" aria-hidden="true"></div>
      <div class="profile-head-text">
        <p class="profile-name" id="googleName"></p>
        <p class="profile-email" id="googleEmail"></p>
      </div>
    </div>

    <p class="notice notice-error" id="errorBox" role="alert" hidden></p>

    <form id="onboardForm" novalidate>
      <label class="field">
        <span class="field-label">사용하실 이름</span>
        <input class="field-input" type="text" id="displayName" maxlength="40"
               autocomplete="nickname" required>
        <span class="field-help">서비스 안에서 표시될 이름입니다. 나중에 마이페이지에서 바꿀 수 있습니다.</span>
      </label>

      <label class="checkbox">
        <input type="checkbox" id="agree" required>
        <span>서비스 이용약관 및 개인정보 처리방침에 동의합니다. (필수)</span>
      </label>

      <button class="btn btn-primary" type="submit" id="submitBtn">가입 완료하기</button>
    </form>

    <p class="auth-foot">
      다른 계정으로 하시겠어요? <a href="#" id="signOutLink">로그아웃</a>
    </p>
  </div>

  <p class="loading" id="loading">불러오는 중…</p>
</main>

<script type="module" src="js/welcome.js"></script>
</body>
</html>
